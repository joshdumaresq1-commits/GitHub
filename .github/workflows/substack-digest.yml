name: Daily Substack Digest

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch:      # allow manual trigger from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/substack_digest/requirements.txt

      - name: Run Substack digest
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          SUBSTACK_RSS_URL:     ${{ secrets.SUBSTACK_RSS_URL }}
          SUBSTACK_PUBLICATIONS: ${{ secrets.SUBSTACK_PUBLICATIONS }}
          DIGEST_EMAIL_TO:      ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_FROM:    ${{ secrets.DIGEST_EMAIL_FROM }}
        run: python scripts/substack_digest/digest.py
